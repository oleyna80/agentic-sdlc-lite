name: Lite Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify canonical documents and committed memory
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            AGENTS.md CLAUDE.md PROJECT_MAP.md PROJECT_BRIEF.md \
            docs/architecture/overview.md \
            docs/workflow/development.md docs/workflow/memory.md docs/workflow/initialization.md \
            docs/workflow/workspaces.md docs/workflow/agent-roles.md \
            docs/security/boundaries.md docs/decisions/README.md \
            memory_bank/context.md memory_bank/progress.md \
            memory_bank/decisions.md memory_bank/orchestrator-log.md; do
            test -s "$file"
          done
          for role in orchestrator architect critic coder reviewer verifier; do
            test -s ".agents/roles/$role.md"
          done
          for file in memory_bank/context.md memory_bank/progress.md \
            memory_bank/decisions.md memory_bank/orchestrator-log.md; do
            git ls-files --error-unmatch "$file" >/dev/null
          done

      - name: Guard new projects against inherited template state
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GITHUB_REPOSITORY:-}" ]]; then
            echo 'Missing GITHUB_REPOSITORY' >&2; exit 1
          fi
          test -s PROJECT_BRIEF.md || { echo 'Missing PROJECT_BRIEF.md' >&2; exit 1; }
          if identity_count=$(grep -Ec '^[[:space:]]*- \*\*Repository identity:\*\*' PROJECT_BRIEF.md); then
            :
          else
            inspection_status=$?
            [[ "$inspection_status" -eq 1 ]] || { echo 'Repository identity inspection failed' >&2; exit 1; }
          fi
          if [[ "$identity_count" -ne 1 ]]; then
            echo 'Repository identity field must occur exactly once' >&2; exit 1
          fi
          expected_identity='- **Repository identity:** `'"$GITHUB_REPOSITORY"'`'
          grep -Fxq -- "$expected_identity" PROJECT_BRIEF.md || { echo 'Repository identity must exactly match GITHUB_REPOSITORY' >&2; exit 1; }
          if [[ "$GITHUB_REPOSITORY" == 'oleyna80/agentic-sdlc-lite' ]]; then
            exit 0
          fi
          if initialization_count=$(grep -Ec '^[[:space:]]*- \*\*Initialization:\*\*' PROJECT_BRIEF.md); then
            :
          else
            inspection_status=$?
            [[ "$inspection_status" -eq 1 ]] || { echo 'Initialization inspection failed' >&2; exit 1; }
          fi
          if [[ "$initialization_count" -ne 1 ]]; then
            echo 'Initialization field must occur exactly once' >&2; exit 1
          fi
          grep -Fxq -- '- **Initialization:** INITIALIZED' PROJECT_BRIEF.md || { echo 'Derived project not INITIALIZED' >&2; exit 1; }
          test -s memory_bank/context.md && test -s memory_bank/progress.md || { echo 'Missing derived active memory' >&2; exit 1; }
          reject_source_marker() {
            local pattern=$1 file=$2 diagnostic=$3 grep_status
            if grep -Eq "$pattern" "$file"; then
              printf '%s\n' "$diagnostic" >&2
              exit 1
            else
              grep_status=$?
              [[ "$grep_status" -eq 1 ]] || { printf 'Source marker inspection failed for %s (exit %s)\n' "$file" "$grep_status" >&2; exit 1; }
            fi
          }
          reject_source_marker '^- \*\*Project:\*\* `oleyna80/agentic-sdlc-lite`([[:space:]]|$)' memory_bank/context.md 'Source project identity in active context'
          reject_source_marker '^- \*\*Integrated baseline:\*\* SDLC Lite v0[.]1 Foundation([[:space:]]|[,.;:]|$)' memory_bank/context.md 'Source integrated baseline in active context'
          reject_source_marker '^- \*\*Delivered task:\*\* WB-LITE-001([[:space:]]|[,.;:]|$)' memory_bank/context.md 'Source task in active context'
          reject_source_marker '^- \*\*[0-9]{4}-[0-9]{2}-[0-9]{2} — WB-LITE-001 integrated into Foundation:\*\*([[:space:]]|$)' memory_bank/progress.md 'Source WB milestone in active progress'
          reject_source_marker '^- \*\*[0-9]{4}-[0-9]{2}-[0-9]{2} — Foundation v0[.]1 integrated into `main`:\*\*([[:space:]]|$)' memory_bank/progress.md 'Source Foundation milestone in active progress'

      - name: Reject copied legacy authority paths
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .agent/controllers
          test ! -e .agent/workflows/sdd-protocol.md
          test ! -e governance/lifecycle.md

      - name: Validate hook syntax and executable bits
        shell: bash
        run: |
          set -euo pipefail
          for hook in pre-commit commit-msg pre-push; do
            bash -n ".githooks/$hook"
            test -x ".githooks/$hook"
          done

      - name: Check introduced whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          commit_count=$(git rev-list --count HEAD) || { echo 'Cannot inspect Git history for whitespace check' >&2; exit 1; }
          [[ "$commit_count" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid Git commit count' >&2; exit 1; }
          if (( commit_count > 1 )); then
            git diff --check HEAD^ HEAD
          else
            git diff-tree --check --root --no-commit-id -r HEAD
          fi
